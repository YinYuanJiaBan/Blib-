<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  body { width: 260px; margin: 0; padding: 14px; font: 14px/1.4 system-ui, sans-serif; color: #111827; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  button { width: 100%; padding: 9px; margin-bottom: 8px; border: 0; border-radius: 6px; font-size: 14px; cursor: pointer; }
  #translate { background: #2563eb; color: #fff; }
  #restore { background: #e5e7eb; color: #111827; }
  label { display: flex; gap: 8px; align-items: center; margin-top: 6px; font-size: 13px; }
  .hint { color: #6b7280; font-size: 12px; margin-top: 10px; }
  #status { font-size: 12px; color: #6b7280; min-height: 16px; margin-bottom: 8px; }
</style>
</head>
<body>
  <h1>中文 → Русский</h1>
  <div id="status"></div>
  <button id="translate">Перевести страницу</button>
  <button id="restore">Показать оригинал</button>
  <label><input type="checkbox" id="auto"> Автоматически переводить китайские сайты</label>
  <label><input type="checkbox" id="never"> Никогда не переводить этот сайт</label>
  <div class="hint">Горячая клавиша: Alt+T</div>
  <script src="popup.js"></script>
</body>
</html>
